---
# In-place cPanel Git deploy. This checkout IS the live app.
# Do not copy the repository onto public_html. public_html/index.php already
# boots ~/urbanfocus and must not be replaced.
# Update from Remote only updates this checkout. Deploy HEAD Commit runs the
# task below (pending migrations, including chat tables). No composer.
# Route actions are controller methods, so route:cache is safe. Group
# closures are not stored in the route cache.
deployment:
  tasks:
    - /bin/bash -c 'for d in "$HOME/urbanfocus" /home/urbanzdc/urbanfocus "$PWD"; do if [ -f "$d/deploy/cpanel-deploy.sh" ]; then exec /bin/bash "$d/deploy/cpanel-deploy.sh"; fi; done; echo "cpanel-deploy.sh not found"; exit 1'
